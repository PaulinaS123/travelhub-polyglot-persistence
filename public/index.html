<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelHub Mini · SQL vs NoSQL</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25372e;background:#f8f7f1}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:40px 18px}header{margin-bottom:30px}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}h2{font-size:20px}p{line-height:1.5;color:#526358}.box{background:white;border:1px solid #dbe3dc;border-radius:14px;padding:20px;margin-bottom:18px}label{font-weight:600}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #bacac0}input{width:100%;min-width:0}button{background:#245447;color:white;border:0;cursor:pointer}button.secondary{background:#e3ede5;color:#245447}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.flex>*{flex:1}.trip{border-top:1px solid #e4e9e4;padding:16px 0}.trip:first-child{border-top:0}.small{font-size:13px;color:#576c60}ul{padding-left:18px}li{margin:7px 0}#message{min-height:24px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #81baab}@media(max-width:500px){.flex{flex-direction:column;align-items:stretch}main{padding:20px 12px}}
</style></head><body><main><header><div class="small">DATABASE ARCHITECTURE DEMO</div><h1>TravelHub Mini</h1><p>Compare identical trip features stored in PostgreSQL tables or MongoDB documents. The databases contain <strong>separate data</strong>.</p></header><section class="box"><label for="engine">Active database</label><select id="engine"><option value="sql">PostgreSQL (SQL)</option><option value="mongo">MongoDB (NoSQL)</option></select><p class="small">Switching databases does not copy or sync trips.</p></section><section class="box"><h2>Create a trip</h2><form id="create" class="flex"><input id="name" placeholder="Trip name" maxlength="120" required><input id="destination" placeholder="Destination" maxlength="120" required><button type="submit">Create trip</button></form></section><p id="message" role="status" aria-live="polite"></p><section class="box"><div class="flex"><h2>Saved trips</h2><button class="secondary" id="refresh">Refresh</button></div><div id="trips">Loading...</div></section></main><script>
const $=id=>document.getElementById(id);const state={engine:'sql'};
const api=(url,method='GET',body)=>fetch('/api/'+state.engine+url,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})}).then(async r=>{let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data});
const msg=s=>$('message').textContent=s;
const element=(tag,content)=>{const e=document.createElement(tag);e.textContent=content;return e};
const btn=(label,action)=>{const b=element('button',label);b.type='button';b.className='secondary';b.addEventListener('click',action);return b};
async function refresh(){const target=$('trips');target.replaceChildren();try{const data=await api('/trips');if(!data.length){target.append(element('p','No trips yet. Create one above.'));return;}for(const trip of data){const item=document.createElement('article');item.className='trip';item.append(element('h3',trip.name+' · '+trip.destination));const ops=document.createElement('div');ops.className='flex';ops.append(btn('Rename',async()=>{const name=prompt('New trip name:',trip.name);if(name===null)return;await run(()=>api('/trips/'+trip.id,'PATCH',{name}));}),btn('Delete trip',async()=>{if(confirm('Delete trip and its activities?'))await run(()=>api('/trips/'+trip.id,'DELETE'));}));item.append(ops);const ul=document.createElement('ul');for(const activity of trip.activities){const li=document.createElement('li');li.append(element('span',activity.title+' '));li.append(btn('Edit',async()=>{const title=prompt('New activity title:',activity.title);if(title===null)return;await run(()=>api('/trips/'+trip.id+'/activities/'+activity.id,'PATCH',{title}));}));li.append(' ');li.append(btn('Remove',()=>run(()=>api('/trips/'+trip.id+'/activities/'+activity.id,'DELETE'))));ul.append(li)}item.append(ul);const activityForm=document.createElement('form');activityForm.className='flex';const input=document.createElement('input');input.placeholder='Add an activity';input.required=true;input.maxLength=120;const button=element('button','Add activity');button.type='submit';activityForm.append(input,button);activityForm.addEventListener('submit',e=>{e.preventDefault();run(()=>api('/trips/'+trip.id+'/activities','POST',{title:input.value}))});item.append(activityForm);target.append(item);}}catch(e){msg(e.message)}}
async function run(fn){try{await fn();msg('Saved successfully.');await refresh()}catch(e){msg(e.message)}}
$('engine').addEventListener('change',e=>{state.engine=e.target.value;msg('');refresh()});$('refresh').addEventListener('click',refresh);$('create').addEventListener('submit',e=>{e.preventDefault();run(()=>api('/trips','POST',{name:$('name').value,destination:$('destination').value}).then(()=>{$('create').reset()}))});refresh();
</script></body></html>
